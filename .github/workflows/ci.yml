name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: namespace-profile-protolabs-linux
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:smoke
      # The CI merge-gate script (ci/protopatch-gate.py) parses the report format
      # reporting.ts renders — its tests pin that coupling (protoAgent#1874).
      - run: python3 ci/test_protopatch_gate.py
